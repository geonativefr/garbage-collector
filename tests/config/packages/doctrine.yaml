doctrine:
  dbal:
    connections:
      default:
        url: 'sqlite:///%kernel.cache_dir%/app.db'
        wrapper_class: GeoNative\GarbageCollector\Tests\App\SpyConnection
      entities:
        url: 'sqlite:///%kernel.cache_dir%/entities.db'
        wrapper_class: GeoNative\GarbageCollector\Tests\App\FlakyConnection
  orm:
    default_entity_manager: default
    entity_managers:
      default:
        connection: default
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
          GarbageCollectorBundle: ~
      entities:
        connection: entities
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
          App:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/App/Entity'
            prefix: 'GeoNative\GarbageCollector\Tests\App\Entity'
            alias: App
